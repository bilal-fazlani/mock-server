[project]
site_name = "Mock Server"
# Describes the product, not the guide: this is the blockquote at the top of
# /llms.txt, so it is the first sentence a machine reader sees. Every page
# overrides it with its own front-matter `description`, leaving 404.html as the
# only HTML page that falls back to this.
site_description = "Mock upstream HTTP services with directories and JSON files instead of request-handling code. Switch scenarios per caller from a dashboard, a runtime API, or JUnit tests."
# Required for instant navigation, the sitemap, and canonical URLs.
site_url = "https://mock-server.bilal-fazlani.com"
repo_url = "https://github.com/bilal-fazlani/mock-server"
repo_name = "bilal-fazlani/mock-server"

nav = [
  { "Overview" = "index.md" },
  { "Get started" = [
    { "Install & run" = "get-started/install.md" },
    { "Your first mock endpoint" = "get-started/first-mock.md" },
  ] },
  { "Building mocks" = [
    { "Endpoints" = "building/endpoints.md" },
    { "Profiles" = "building/profiles.md" },
    { "Scenarios" = "building/scenarios.md" },
    { "Code-backed resolvers" = "building/dynamic.md" },
    { "Fixtures" = "building/fixtures.md" },
    { "Placeholders & templating" = "building/templating.md" },
    { "Schemas" = "building/schemas.md" },
    { "Validating a catalog" = "building/validate.md" },
  ] },
  { "Driving mocks" = [
    { "The dashboard" = "driving/ui.md" },
    { "Runtime-control API" = "driving/api.md" },
    { "Using it in dev & CI" = "driving/dev-and-ci.md" },
    { "Request logs" = "driving/request-logs.md" },
    { "Console logs" = "driving/console-logs.md" },
  ] },
  { "Testing SDKs" = [
    { "Overview" = "sdk/index.md" },
    { "Java quick start" = "sdk/java-quickstart.md" },
    { "JUnit 5 guide" = "sdk/junit.md" },
    { "Spring Boot guide" = "sdk/spring-boot.md" },
    { "Testcontainers & the client" = "sdk/testcontainers-client.md" },
  ] },
  { "Reference" = [
    { "Configuration" = "reference/configuration.md" },
    { "Request lifecycle" = "reference/request-lifecycle.md" },
    { "Gotchas" = "reference/gotchas.md" },
  ] },
]

[project.theme]
features = [
  "navigation.sections",          # top-level sections as sidebar groups
  "navigation.footer",            # prev/next links in the footer
  "navigation.top",               # back-to-top button
  "content.code.select",          # line-selection button on code blocks
  "content.code.copy",            # copy button on code blocks
  "content.code.annotate",        # numbered annotations on code lines
  "navigation.instant",           # SPA-style instant page loading (needs site_url)
  "navigation.instant.prefetch",  # prefetch links on hover
  "navigation.instant.progress",  # loading progress bar for slower loads
]

# Where an annotation marker may sit inside a `json` block. JSON has no comments,
# so the theme has no default for it and `(1)!` markers are left as literal text
# unless a token selector is named here.
#
# `.c1` — the comment token. Pygments' JSON lexer tolerates a `//` comment and
# tags it `c1`, and the theme then replaces the *whole* comment with the
# annotation marker. That is what keeps a ```json block valid JSON: the `//
# (1)!` a reader would otherwise copy is not in the rendered DOM at all, so
# selecting or copying the block yields something that parses.
#
# Deliberately NOT `.s2` (a double-quoted string): a marker inside a string is
# legal JSON but the theme consumes the entire string token, rendering
# `"description": ,` — the value disappears. Keep markers in `//` comments.
[project.extra.annotate]
json = [".c1"]

# Light + dark, with a toggle in the header (defaults to the reader's OS setting).
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

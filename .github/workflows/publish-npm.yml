name: Publish npm package

# Publish to npm only on releases, in lockstep with the container image:
#   - Publishing a GitHub Release "v1.2.0" builds and publishes the package.
#   - Manual runs are supported for re-publishing a release: dispatch against
#     a tag ref (v*).
#   - `latest` goes only to the highest release by semver. A backport publishes
#     under <major>.<minor>-backport, a prerelease under `next`.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (auth) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide the npm dist-tag
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/release-order.sh "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10, which rejects the npm-11-generated lockfile.
      # Keep in sync with ci.yml and the Dockerfile deps stage.
      - name: Pin npm 11 (must match the npm major that wrote the lockfile)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # `prepack` runs `next build` and stages static/public into the
      # standalone tree before packing.
      - name: Publish
        env:
          NPM_TAG: ${{ steps.order.outputs.npm_tag }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"

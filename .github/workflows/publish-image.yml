name: Publish container image

# Build and publish images only for releases (keeps CI minutes down):
#   - Publish a GitHub Release "v1.2.0" -> tag, notes, and a semver-tagged
#     image (1.2.0, 1.2, 1, latest) are produced together.
#   - Manual runs are supported for re-publishing a release: dispatch this
#     workflow against a tag ref (v*) so the semver tags resolve.
#
# `latest` and the major tag follow the highest release by semver, not the
# trigger and not the newest-created release, so a backport cannot take them.
#
# (history) `latest` used to follow the trigger. It used to be gated on
# `github.event_name == 'release'`, so a manual re-publish produced the semver
# tags and silently skipped `latest` — which is how `latest` came to sit on 0.9.0
# for the whole of the 0.10.0 line (#80). Since `latest` is the default for both
# `docker run` and the Java SDK's `new MockServerContainer()`, everyone on the
# default was a release behind. Both triggers now ask the same question — is the
# ref being built the newest non-prerelease release? — and the answer, with its
# reason, goes into the job summary so a stale `latest` cannot pass unremarked.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Stays on the runner that owns the release so the decision is made once and
  # both the build and the manifest merge read the same answer.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      move_latest: ${{ steps.latest.outputs.move }}
    steps:
      # The semver tags are derived from the ref, so a run against anything but a
      # tag would build and push nothing. Stop with a message rather than leaving
      # a green run that published no image.
      - name: Require a tag ref for a manual run
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "::error::Dispatch this workflow against a release tag (v*), not ${{ github.ref }}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # `latest` and the major tag belong to the highest published release, by
      # semver. A backport (0.16.1 after 0.19.0) keeps its own version and
      # major.minor tags and moves neither. Prereleases never move them.
      - name: Decide whether to move latest and the major tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          .github/scripts/release-order.sh "$REF_NAME" >> "$RUNNER_TEMP/order"
          . "$RUNNER_TEMP/order"
          if [ "$IS_PRERELEASE" = "true" ]; then
            move=false
            why="this release is a prerelease"
          elif [ "$is_highest" = true ]; then
            move=true
            why="$REF_NAME is the highest release"
          else
            move=false
            why="$REF_NAME is not the highest release ($highest is)"
          fi
          echo "move=$move" >> "$GITHUB_OUTPUT"
          if [ "$move" = true ]; then
            echo "\`latest\` and the major tag **will** be moved to this build — $why." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\`latest\` and the major tag will **not** be moved — $why." >> "$GITHUB_STEP_SUMMARY"
          fi

  # One native runner per platform: emulating arm64 under QEMU took ~8 min, and
  # cross-building is no help because the standalone output carries per-platform
  # native binaries. Each leg pushes an untagged image by digest; `merge` tags them.
  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to GitHub Packages (ghcr.io)
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # a release/tag v1.2.0 -> 1.2.0, 1.2, and 1 and latest when this run owns them.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ needs.prepare.outputs.move_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.move_latest == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

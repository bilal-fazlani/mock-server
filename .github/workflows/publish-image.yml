name: Publish container image

# Build and publish images only for releases (keeps CI minutes down):
#   - Publish a GitHub Release "v1.2.0" -> tag, notes, and a semver-tagged
#     image (1.2.0, 1.2, 1, latest) are produced together.
#   - Manual runs are supported for re-publishing a release: dispatch this
#     workflow against a tag ref (v*) so the semver tags resolve.
#
# `latest` follows the newest release, not the trigger. It used to be gated on
# `github.event_name == 'release'`, so a manual re-publish produced the semver
# tags and silently skipped `latest` — which is how `latest` came to sit on 0.9.0
# for the whole of the 0.10.0 line (#80). Since `latest` is the default for both
# `docker run` and the Java SDK's `new MockServerContainer()`, everyone on the
# default was a release behind. Both triggers now ask the same question — is the
# ref being built the newest non-prerelease release? — and the answer, with its
# reason, goes into the job summary so a stale `latest` cannot pass unremarked.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Stays on the runner that owns the release so the decision is made once and
  # both the build and the manifest merge read the same answer.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      move_latest: ${{ steps.latest.outputs.move }}
    steps:
      # The semver tags are derived from the ref, so a run against anything but a
      # tag would build and push nothing. Stop with a message rather than leaving
      # a green run that published no image.
      - name: Require a tag ref for a manual run
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "::error::Dispatch this workflow against a release tag (v*), not ${{ github.ref }}."
          exit 1

      # Does this run own `latest`? A release event knows from its own payload; a
      # manual run has to ask, because re-publishing an older tag must never pull
      # `latest` back onto an older image. `GET /releases/latest` ignores drafts
      # and prereleases, so both branches agree on what "newest" means.
      - name: Decide whether to move the latest tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              move=false
              why="this release is a prerelease"
            else
              move=true
              why="$REF_NAME was just published as a release"
            fi
          else
            # No releases yet: nothing to be newer than, so nothing to move.
            newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [ -z "$newest" ]; then
              move=false
              why="the repository has no published release to compare $REF_NAME against"
            elif [ "$REF_NAME" = "$newest" ]; then
              move=true
              why="$REF_NAME is the newest release"
            else
              move=false
              why="$REF_NAME is not the newest release ($newest is)"
            fi
          fi
          echo "move=$move" >> "$GITHUB_OUTPUT"
          if [ "$move" = true ]; then
            echo "\`latest\` **will** be moved to this build — $why." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\`latest\` will **not** be moved — $why." >> "$GITHUB_STEP_SUMMARY"
          fi

  # One native runner per platform: emulating arm64 under QEMU took ~8 min, and
  # cross-building is no help because the standalone output carries per-platform
  # native binaries. Each leg pushes an untagged image by digest; `merge` tags them.
  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to GitHub Packages (ghcr.io)
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # a release/tag v1.2.0 -> 1.2.0, 1.2, 1, and latest when this run owns it.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.move_latest == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
